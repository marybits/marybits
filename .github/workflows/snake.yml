name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"     # runs daily at 6:00 UTC (~1am Ottawa)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches: [main]          # regenerates when you update the profile repo

permissions:
  contents: write             # the job needs permission to push the SVG

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Renders your contribution graph as an animated snake SVG,
      # themed with the Aurora Arctic palette
      - uses: Platane/snk@v3
        with:
          github_user_name: marybits
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#64FFDA&color_dots=#0B1929,#1E3A5F,#3B6EA5,#A78BFA,#64FFDA

      # Pushes the generated SVG to a branch called "output",
      # which the README references via raw.githubusercontent.com
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
